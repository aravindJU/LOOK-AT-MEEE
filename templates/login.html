<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOOK AT ME // sign in</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">
  <header class="auth-header">
    <span class="rig-name">LOOK AT ME</span>
    <span class="rig-model">ACCOUNT ACCESS</span>
  </header>
  <main class="auth-card">
    <p class="auth-subtitle">SIGN IN</p>
    <form id="loginForm" class="auth-form">
      <input id="loginUsername" type="text" placeholder="Username" autocomplete="username" required />
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">SIGN IN</button>
    </form>
    <p id="authStatus" class="auth-page-status" aria-live="polite"></p>
    <a href="/register">CREATE ACCOUNT</a>
    <a href="/">BACK TO MONITOR</a>
  </main>
  <script type="module" src="/static/js/auth.js"></script>
</body>
</html>
